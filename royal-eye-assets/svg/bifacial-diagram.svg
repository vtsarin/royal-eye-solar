<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img" aria-labelledby="bft bfd">
  <title id="bft">How a bifacial solar panel captures light</title>
  <desc id="bfd">A tilted solar panel receives direct sunlight on its front face. Light reflected off the ground reaches the rear face as well, raising total output by five to thirty percent depending on installation conditions.</desc>

  <g id="sun">
    <circle cx="118" cy="72" r="26" fill="var(--sun,#FFB020)" opacity=".16"/>
    <circle cx="118" cy="72" r="15" fill="var(--sun,#FFB020)"/>
  </g>

  <g id="ground">
    <line x1="40" y1="318" x2="640" y2="318" stroke="var(--line,rgba(255,255,255,0.20))" stroke-width="1"/>
    <g stroke="var(--line,rgba(255,255,255,0.10))" stroke-width="1">
      <line x1="40" y1="330" x2="70" y2="318"/>
      <line x1="88" y1="330" x2="118" y2="318"/>
      <line x1="136" y1="330" x2="166" y2="318"/>
      <line x1="184" y1="330" x2="214" y2="318"/>
      <line x1="232" y1="330" x2="262" y2="318"/>
      <line x1="280" y1="330" x2="310" y2="318"/>
      <line x1="328" y1="330" x2="358" y2="318"/>
      <line x1="376" y1="330" x2="406" y2="318"/>
      <line x1="424" y1="330" x2="454" y2="318"/>
      <line x1="472" y1="330" x2="502" y2="318"/>
      <line x1="520" y1="330" x2="550" y2="318"/>
      <line x1="568" y1="330" x2="598" y2="318"/>
      <line x1="610" y1="330" x2="640" y2="318"/>
    </g>
    <text x="40" y="352" font-size="11" letter-spacing=".12em" fill="var(--muted,#646C87)">GROUND / ALBEDO SURFACE</text>
  </g>

  <g id="mount">
    <line x1="330" y1="318" x2="330" y2="238" stroke="var(--frame,#7C8AAE)" stroke-width="3"/>
    <line x1="300" y1="318" x2="360" y2="318" stroke="var(--frame,#7C8AAE)" stroke-width="3"/>
  </g>

  <g id="front-capture">
    <g stroke="var(--sun,#FFB020)" stroke-width="1.5" stroke-linecap="round">
      <line x1="140" y1="92" x2="262" y2="196"/>
      <line x1="164" y1="80" x2="292" y2="188"/>
      <line x1="190" y1="72" x2="322" y2="180"/>
      <line x1="216" y1="66" x2="352" y2="174"/>
    </g>
    <polygon points="262,196 268,188 274,199" fill="var(--sun,#FFB020)"/>
    <polygon points="352,174 358,166 364,177" fill="var(--sun,#FFB020)"/>
  </g>

  <g id="panel" transform="rotate(-24 330 208)">
    <rect x="238" y="192" width="184" height="32" rx="2" fill="none" stroke="var(--frame,#7C8AAE)" stroke-width="2.5"/>
    <rect x="240" y="194" width="180" height="14" fill="var(--cell-front,#1B2A66)"/>
    <rect x="240" y="209" width="180" height="13" fill="var(--cell-rear,#111C42)"/>
    <g stroke="var(--busbar,rgba(190,210,255,0.28))" stroke-width=".8">
      <line x1="270" y1="194" x2="270" y2="222"/>
      <line x1="300" y1="194" x2="300" y2="222"/>
      <line x1="330" y1="194" x2="330" y2="222"/>
      <line x1="360" y1="194" x2="360" y2="222"/>
      <line x1="390" y1="194" x2="390" y2="222"/>
    </g>
    <line x1="240" y1="208.5" x2="420" y2="208.5" stroke="var(--frame,#7C8AAE)" stroke-width="1.25"/>
  </g>

  <g id="rear-capture">
    <g stroke="var(--lime,#8FD14F)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4">
      <line x1="252" y1="300" x2="286" y2="248"/>
      <line x1="300" y1="308" x2="326" y2="252"/>
      <line x1="352" y1="310" x2="368" y2="254"/>
      <line x1="404" y1="306" x2="410" y2="250"/>
    </g>
    <polygon points="286,248 294,252 285,257" fill="var(--lime,#8FD14F)"/>
    <polygon points="410,250 418,254 409,259" fill="var(--lime,#8FD14F)"/>
    <text x="446" y="292" font-size="12" fill="var(--lime,#8FD14F)">reflected light on rear face</text>
  </g>

  <g id="readout">
    <text x="446" y="120" font-size="11" letter-spacing=".14em" fill="var(--muted,#646C87)">TOTAL OUTPUT</text>
    <text id="yield-value" x="446" y="166" font-size="42" font-weight="500" fill="var(--fg,#F3F5FB)">+5&#8211;30%</text>
    <text id="yield-caption" x="446" y="190" font-size="12" fill="var(--secondary,#9BA3BC)">front and rear capture</text>
  </g>
</svg>
